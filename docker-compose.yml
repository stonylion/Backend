version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: stony-mysql-local
    restart: unless-stopped
    ports:
      - "3307:3306"   # 로컬 3307 -> 컨테이너 3306 (서버/로컬 충돌 방지)
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: stony_local
      MYSQL_USER: stony
      MYSQL_PASSWORD: stonypw
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
